# Render Blueprint — deploy with "New → Blueprint" and point to this repo
services:
  - type: web
    name: infisical-render-test
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --experimental-strip-types src/server.ts
    envVars:
      # Bootstrap secrets — set these in the Render dashboard
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      # Infisical project config
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENVIRONMENT
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      # Optional: for self-hosted Infisical
      # - key: INFISICAL_SITE_URL
      #   value: https://your-infisical-instance.com
