# Render Blueprint — deploy with "New → Blueprint" and point to this repo
services:
  - type: cron
    name: db-backup-test
    runtime: docker
    plan: starter
    region: virginia
    schedule: "0 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_STORAGE_ACCOUNT
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        sync: false
